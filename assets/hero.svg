<svg viewBox="0 0 880 300" width="880" height="300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jeffrey Ullers, front-end developer at The Valley, part of Assist Digital, Zaandam NL">
  <defs>
    <clipPath id="panel"><rect width="880" height="300" rx="18"/></clipPath>
    <radialGradient id="gBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gSky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gLime" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#A3E635" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gName" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#3B82F6" opacity="0.14">
        <animate attributeName="opacity" values="0.08;0.20;0.08" dur="6s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="22 22" dur="18s" repeatCount="indefinite"/>
    </pattern>
  </defs>
  <style>
    text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .b1{animation:d1 18s ease-in-out infinite alternate}
    .b2{animation:d2 13s ease-in-out infinite alternate}
    .b3{animation:d3 21s ease-in-out infinite alternate}
    @keyframes d1{from{transform:translate(0,0)}to{transform:translate(120px,-34px)}}
    @keyframes d2{from{transform:translate(0,0)}to{transform:translate(-140px,28px)}}
    @keyframes d3{from{transform:translate(0,0)}to{transform:translate(60px,46px)}}
    .cur{animation:blink 1.2s steps(1) infinite}
    @keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.b1,.b2,.b3,.cur{animation:none}}
  </style>
  <g clip-path="url(#panel)">
    <rect width="880" height="300" fill="#0A1128"/>
    <g class="b1"><ellipse cx="170" cy="60" rx="270" ry="160" fill="url(#gBlue)" filter="url(#soft)"/></g>
    <g class="b2"><ellipse cx="710" cy="250" rx="300" ry="170" fill="url(#gSky)" opacity="0.45" filter="url(#soft)"/></g>
    <g class="b3"><ellipse cx="820" cy="30" rx="210" ry="130" fill="url(#gLime)" opacity="0.30" filter="url(#soft)"/></g>
    <rect width="880" height="300" fill="url(#dots)"/>
    <text class="mono" x="30" y="42" font-size="14" fill="#A3E635" opacity="0.9">~/justjeffvibes</text>
    <text class="mono" x="850" y="42" font-size="13" fill="#64748B" text-anchor="end">Zaandam &#183; NL</text>
    <text x="440" y="112" font-size="12" font-weight="600" letter-spacing="3.5" fill="#60A5FA" text-anchor="middle">WEB DEVELOPER @ THE VALLEY &#8212; PART OF ASSIST DIGITAL</text>
    <text x="440" y="168" font-size="56" font-weight="800" letter-spacing="-1" fill="url(#gName)" text-anchor="middle">Jeffrey Ullers</text>
    <text class="mono" x="440" y="212" font-size="17" fill="#A3E635" text-anchor="middle">front-end focused &#183; full-stack capable</text>
    <rect class="cur" x="648" y="198" width="8" height="17" fill="#A3E635"/>
    <text x="440" y="256" font-size="14" fill="#94A3B8" text-anchor="middle">Building interfaces that feel as good as they look &#8212; from design system to deploy.</text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="299" rx="18" fill="none" stroke="#1E3A8A"/>
</svg>

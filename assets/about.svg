<svg width="880" height="250" viewBox="0 0 880 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About — I build for The Valley, part of Assist Digital, turning designs into clean, reusable components that survive contact with production. Front-end focused, full-stack capable, down to the API. Studied Communication and Multimedia Design at the Hogeschool van Amsterdam, based in Zaandam NL. What I do: front-end with JavaScript, TypeScript, Vue, Nuxt and Next.js; back-end with Node, Express and MongoDB; UX/UI design with design systems and Storybook. Currently building a Next.js and TypeScript starter.">
  <defs>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsA" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#3B82F6" opacity="0.12">
        <animate attributeName="opacity" values="0.06;0.18;0.06" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="22 22" dur="17s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="clipA"><rect width="880" height="250" rx="18"/></clipPath>
  </defs>
  <style>
    .s{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .bd{animation:bd 19s ease-in-out infinite alternate}
    @keyframes bd{from{transform:translate(0,0)}to{transform:translate(-70px,30px)}}
    @media (prefers-reduced-motion:reduce){.bd{animation:none}}
  </style>
  <g clip-path="url(#clipA)">
    <rect width="880" height="250" fill="#0A1128"/>
    <g class="bd"><ellipse cx="810" cy="16" rx="230" ry="150" fill="url(#glowA)" opacity="0.45"/></g>
    <rect width="880" height="250" fill="url(#dotsA)"/>
    <line x1="498" y1="36" x2="498" y2="214" stroke="#1E3A8A" stroke-width="1"/>

    <text class="m" x="44" y="52" font-size="12" font-weight="700" letter-spacing="3" fill="#60A5FA">ABOUT</text>
    <text class="s" x="44" y="92" font-size="15" fill="#C9D1D9">I build for The Valley — part of Assist Digital,</text>
    <text class="s" x="44" y="118" font-size="15" fill="#C9D1D9">turning designs into clean, reusable components</text>
    <text class="s" x="44" y="144" font-size="15" fill="#C9D1D9">that survive contact with production. Front-end</text>
    <text class="s" x="44" y="170" font-size="15" fill="#C9D1D9">focused, full-stack capable — down to the API.</text>
    <text class="s" x="44" y="210" font-size="13" fill="#7C8BA5">Studied Communication &amp; Multimedia Design at HvA</text>

    <text class="m" x="520" y="52" font-size="12" font-weight="700" letter-spacing="3" fill="#60A5FA">WHAT I DO</text>
    <text class="m" x="520" y="96" font-size="14" fill="#A3E635">&lt;/&gt;</text>
    <text class="s" x="558" y="96" font-size="13" fill="#DCE3EC">Front-end — JS, TS, Vue, Nuxt, Next.js</text>
    <text class="m" x="520" y="130" font-size="14" fill="#A3E635">{ }</text>
    <text class="s" x="558" y="130" font-size="13" fill="#DCE3EC">Back-end — Node, Express, MongoDB</text>
    <text class="m" x="520" y="164" font-size="14" fill="#A3E635">[ ]</text>
    <text class="s" x="558" y="164" font-size="13" fill="#DCE3EC">UX/UI — design systems, Storybook</text>
    <text class="m" x="520" y="206" font-size="12" fill="#7C8BA5">now — Next.js + TypeScript starter</text>
  </g>
  <rect x="0.5" y="0.5" width="879" height="249" rx="18" fill="none" stroke="#1E3A8A"/>
</svg>
